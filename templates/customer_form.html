<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Customer Segmentation</title>

    <link rel="stylesheet"
          href="{{ url_for('static', path='/css/style.css') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <nav>
        <div class="container">
            <h2>Customer Segmentation</h2>
        </div>
    </nav>


    <section class="form-section">

        <div class="container">

            <div class="result-container">

                <h2>Customer Cluster</h2>

                <div class="cluster-result">
                    {{ predicted_cluster }}
                </div>

            </div>

            <div class="form-container">

                <p class="description">
                    Enter customer information to predict the customer cluster.
                </p>


                <form action="/" method="post">

                    <div class="mb-3">
                        <label for="Age">Age</label>
                        <input type="number"
                               class="form-control"
                               id="Age"
                               name="Age"
                               placeholder="Customer Age"
                               required>
                    </div>


                    <div class="mb-3">
                        <label for="Education">Education of Customer</label>

                        <select class="form-control"
                                id="Education"
                                name="Education"
                                required>

                            <option value="" disabled selected>
                                Select Education
                            </option>

                            <option value="0">Basic</option>
                            <option value="1">2n Cycle</option>
                            <option value="2">Graduation</option>
                            <option value="3">Master</option>
                            <option value="4">PhD</option>

                        </select>
                    </div>


                    <div class="mb-3">
                        <label for="Marital_Status">Married</label>

                        <select class="form-control"
                                id="Marital_Status"
                                name="Marital_Status"
                                required>

                            <option value="" disabled selected>
                                Is Married
                            </option>

                            <option value="0">No</option>
                            <option value="1">Yes</option>

                        </select>
                    </div>


                    <div class="mb-3">
                        <label for="Parental_Status">Has Kids</label>

                        <select class="form-control"
                                id="Parental_Status"
                                name="Parental_Status"
                                required>

                            <option value="" disabled selected>
                                Has Kids
                            </option>

                            <option value="0">No</option>
                            <option value="1">Yes</option>

                        </select>
                    </div>


                    <div class="mb-3">
                        <label for="Children">Number of Children</label>

                        <input type="number"
                               class="form-control"
                               id="Children"
                               name="Children"
                               placeholder="Number of Children"
                               required>
                    </div>


                    <div class="mb-3">
                        <label for="Income">Income of Customer</label>

                        <input type="number"
                               class="form-control"
                               id="Income"
                               name="Income"
                               placeholder="Customer Income"
                               required>
                    </div>


                    <div class="mb-3">
                        <label for="Total_Spending">Total Money Spending</label>

                        <input type="number"
                               class="form-control"
                               id="Total_Spending"
                               name="Total_Spending"
                               placeholder="Total Money Spending"
                               required>
                    </div>


                    <div class="mb-3">
                        <label for="Days_as_Customer">
                            Days of Being Customer
                        </label>

                        <input type="number"
                               class="form-control"
                               id="Days_as_Customer"
                               name="Days_as_Customer"
                               placeholder="Days of Being Customer"
                               required>
                    </div>


                    <div class="mb-3">
                        <label for="Recency">
                            Number of Days Since Last Purchase
                        </label>

                        <input type="number"
                               class="form-control"
                               id="Recency"
                               name="Recency"
                               placeholder="Days Since Last Purchase"
                               required>
                    </div>


                    <div class="mb-3">
                        <label for="Wines">
                            Amount Spent on Wine in Last 2 Years
                        </label>

                        <input type="number"
                               class="form-control"
                               id="Wines"
                               name="Wines"
                               placeholder="Wine Spending"
                               required>
                    </div>


                    <div class="mb-3">
                        <label for="Fruits">
                            Amount Spent on Fruits in Last 2 Years
                        </label>

                        <input type="number"
                               class="form-control"
                               id="Fruits"
                               name="Fruits"
                               placeholder="Fruit Spending"
                               required>
                    </div>


                    <div class="mb-3">
                        <label for="Meat">
                            Amount Spent on Meat in Last 2 Years
                        </label>

                        <input type="number"
                               class="form-control"
                               id="Meat"
                               name="Meat"
                               placeholder="Meat Spending"
                               required>
                    </div>


                    <div class="mb-3">
                        <label for="Fish">
                            Amount Spent on Fish in Last 2 Years
                        </label>

                        <input type="number"
                               class="form-control"
                               id="Fish"
                               name="Fish"
                               placeholder="Fish Spending"
                               required>
                    </div>


                    <div class="mb-3">
                        <label for="Sweets">
                            Amount Spent on Sweets in Last 2 Years
                        </label>

                        <input type="number"
                               class="form-control"
                               id="Sweets"
                               name="Sweets"
                               placeholder="Sweets Spending"
                               required>
                    </div>


                    <div class="mb-3">
                        <label for="Gold">
                            Amount Spent on Gold in Last 2 Years
                        </label>

                        <input type="number"
                               class="form-control"
                               id="Gold"
                               name="Gold"
                               placeholder="Gold Spending"
                               required>
                    </div>


                    <div class="mb-3">
                        <label for="Web">
                            Number of Purchases Through Website
                        </label>

                        <input type="number"
                               class="form-control"
                               id="Web"
                               name="Web"
                               placeholder="Web Purchases"
                               required>
                    </div>


                    <div class="mb-3">
                        <label for="Catalog">
                            Number of Purchases Using Catalogue
                        </label>

                        <input type="number"
                               class="form-control"
                               id="Catalog"
                               name="Catalog"
                               placeholder="Catalogue Purchases"
                               required>
                    </div>


                    <div class="mb-3">
                        <label for="Store">
                            Number of Purchases Made in Stores
                        </label>

                        <input type="number"
                               class="form-control"
                               id="Store"
                               name="Store"
                               placeholder="Store Purchases"
                               required>
                    </div>


                    <div class="mb-3">
                        <label for="Discount_Purchases">
                            Number of Discount Purchases
                        </label>

                        <input type="number"
                               class="form-control"
                               id="Discount_Purchases"
                               name="Discount_Purchases"
                               placeholder="Discount Purchases"
                               required>
                    </div>


                    <div class="mb-3">
                        <label for="Total_Promo">
                            Number of Accepted Promotion Offers
                        </label>

                        <input type="number"
                               class="form-control"
                               id="Total_Promo"
                               name="Total_Promo"
                               placeholder="Accepted Promotions"
                               required>
                    </div>


                    <div class="mb-3">
                        <label for="NumWebVisitsMonth">
                            Website Visits in Last Month
                        </label>

                        <input type="number"
                               class="form-control"
                               id="NumWebVisitsMonth"
                               name="NumWebVisitsMonth"
                               placeholder="Website Visits"
                               required>
                    </div>


                    <button class="btn btn-primary predict-btn"
                            type="submit">

                        Predict Customer Cluster

                    </button>

                </form>

            </div>

        </div>

    </section>


    <script src="https://code.jquery.com/jquery-3.2.1.js"></script>

    <script>
        $(".form-control").focus(function () {
            $(this).parent().addClass("focus");
        }).blur(function () {
            if ($(this).val() === '') {
                $(this).parent().removeClass("focus");
            }
        });
    </script>

</body>

</html>
